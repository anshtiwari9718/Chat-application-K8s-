apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend-pod
      namespace: chat-app
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: anshtiwari9718/chat-app-backend
        ports:
         -  containerPort: 5001
        env:
         - name: NODE_ENV
           value: production  
         - name: PORT  
           value: "5001"
         - name: MONGODB_URI
           value: "mongodb://root:admin@mongo:27017/chatApp?authSource=admin&retryWrites=true&w=majority"
         - name:  JWT_SECRET
           valueFrom:
             secretKeyRef:
                name: mysecret
                key: password 
