apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      name: mongo-pod
      namespace: chat-app
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo-container
        image: mongo:latest 
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: admin
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
             